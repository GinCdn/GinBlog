      description: 分页获取标签列表（管理员看所有，用户仅看管理员预留标签）
      parameters:
      - description: 页码（默认1）
        in: query
        name: page
        type: integer
      - description: 每页条数（可选20/50/100，默认20）
        in: query
        name: page_size
        type: integer
      - description: 排序方式（create_time_desc-降序，create_time_asc-升序，默认降序）
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 分页标签列表
          schema:
            allOf:
            - $ref: '#/definitions/result.Result'
            - properties:
                data:
                  $ref: '#/definitions/model.TagListResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/result.Result'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/result.Result'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/result.Result'
      security:
      - ApiKeyAuth: []
      summary: 分页获取标签列表
      tags:
      - 标签相关接口
  /api/user/UpdateEmailPwd:
    post:
      description: 通过邮箱修改用户密码
      parameters:
      - description: 邮箱账号
        in: formData
        name: email
        required: true
        type: string
      - description: 验证码
        in: formData
        name: code
        required: true
        type: string
      - description: 新密码(6-20位，必须包含字母大小写数字三种类型)
        in: formData
        name: new_pwd
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/result.Result'
            - properties:
                data:
                  $ref: '#/definitions/model.UpdateEmailPwd'
              type: object
      summary: 通过邮箱修改用户密码
      tags:
      - 用户相关接口
  /api/user/UpdateTag:
    post:
      description: 修改标签名（管理员可修改所有标签，用户仅可修改自己创建的标签）
      parameters:
      - description: 标签ID
        in: formData
        name: id
        required: true
        type: integer
      - description: 新标签名
        in: formData
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 修改成功返回标签信息
          schema:
            allOf:
            - $ref: '#/definitions/result.Result'
            - properties:
                data:
                  type: boolean
              type: object
        "400":
          description: 参数错误或标签名已存在
          schema:
            $ref: '#/definitions/result.Result'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/result.Result'
      security:
      - ApiKeyAuth: []
      summary: 修改标签名
      tags:
      - 标签相关接口
  /api/user/getUserInfo:
    get:
      description: 获取用户信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/result.Result'
      security:
      - ApiKeyAuth: []
      summary: 获取用户信息
      tags:
      - 用户相关接口
  /api/user/login:
    post:
      description: 用户登录接口
      parameters:
      - description: 用户名
        in: formData
        name: username
        required: true
        type: string
      - description: 密码
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/result.Result'
            - properties:
                data:
                  $ref: '#/definitions/model.UserLoginDto'
              type: object
      summary: 用户登录
      tags:
      - 用户相关接口
  /api/user/register:
    post:
      description: 用户注册接口
      parameters:
      - description: 用户名(5-20位)
        in: formData
        name: username
        required: true
        type: string
      - description: 密码(6-20位，需包含字母大小写数字三种类型)
        in: formData
        name: password
        required: true
        type: string
      - description: QQ(5-11位数字)
        in: formData
        name: qq
        required: true
        type: string
      - description: 邮箱(test@qq.com)
        in: formData
        name: email
        required: true
        type: string
      - description: 手机号(11位数字)
        in: formData
        name: phone
        required: true
        type: string
      - description: 性别(1=男,2=女)
        enum:
        - 1
        - 2
        in: formData
        name: sex
        required: true
        type: integer
      - description: 验证码
        in: formData
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/result.Result'
            - properties:
                data:
                  $ref: '#/definitions/model.CreateUserDto'
              type: object
      summary: 用户注册接口
      tags:
      - 用户相关接口
  /api/user/update:
    post:
      description: 修改用户信息
      parameters:
      - description: 昵称
        in: formData
        name: nick_name
        type: string
      - description: QQ(5-11位数字)
        in: formData
        name: qq
        type: string
      - description: 邮箱(test@qq.com)
        in: formData
        name: email
        type: string
      - description: 手机号(11位数字)
        in: formData
        name: phone
        type: string
      - description: 性别(1=男,2=女)
        enum:
        - 1
        - 2
        in: formData
        name: sex
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/result.Result'
            - properties:
                data:
                  $ref: '#/definitions/model.UpdateUserDto'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 修改用户信息
      tags:
      - 用户相关接口
  /api/user/updatePwd:
    post:
      description: 修改用户密码
      parameters:
      - description: 用户名
        in: formData
        name: username
        required: true
        type: string
      - description: 原密码
        in: formData
        name: old_pwd
        required: true
        type: string
      - description: 新密码(6-20位，必须包含字母大小写数字三种类型)
        in: formData
        name: new_pwd
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/result.Result'
            - properties:
                data:
                  $ref: '#/definitions/model.UserPwdDto'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 修改用户密码
      tags:
      - 用户相关接口
  /api/user/upload:
    post:
      consumes:
      - multipart/form-data
      description: 用户端图片文件上传（提现二维码等场景），安全校验与管理员上传一致
      parameters:
      - description: 文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 返回文件访问URL
          schema:
            allOf:
            - $ref: '#/definitions/result.Result'
            - properties:
                data:
                  type: string
              type: object
      security:
      - ApiKeyAuth: []
      summary: 用户图片文件上传
      tags:
      - 文件上传相关接口
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
